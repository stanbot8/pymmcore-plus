name: CI input verification
on:
  workflow_dispatch:
    inputs:
      probe:
        type: string
        required: true
permissions:
  contents: write
  issues: write
jobs:
  call:
    uses: ./.github/workflows/crucible-call-alpha-bridge-ci-probe.yml
    with:
      probe: ${{ inputs.probe }}
    permissions:
      contents: write
      issues: write
      actions: read
